swagger: "2.0"

basePath: "/v1"

info:
  title: "API"
  version: "1.0.0"

schemes:
- "http"

tags:
  - name: "API"
  - name: "Gatherer"
  - name: "Magic"
  - name: "Maintenance"

paths:
  /healthcheck:
    get:
      tags:
        - "Maintenance"
      summary: "Returns service status"
      operationId: "routes.healthcheck.route_healthcheck"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /cards:
    get:
      tags:
        - "API"
      summary: "Return card list"
      operationId: "routes.cards.route_cards"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /formats:
    get:
      tags:
        - "API"
      summary: "Return format list"
      operationId: "routes.formats.route_formats"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /sets:
    get:
      tags:
        - "API"
      summary: "Return set list"
      operationId: "routes.sets.route_sets"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /types:
    get:
      tags:
        - "API"
      summary: "Return type list"
      operationId: "routes.types.route_types"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /scrapers/gatherer/cards/{card_id}:
    post:
      tags:
        - "Gatherer"
      summary: "Queue Gatherer card for processing"
      operationId: "routes.scrapers.gatherer.route_cards"
      produces:
        - "application/json"
      parameters:
        - name: "card_id"
          in: "path"
          description: "ID of Gatherer card"
          required: true
          type: "integer"
          format: "int64"
      responses:
        200:
          description: "Success"

  /scrapers/gatherer/pages/{page_id}:
    post:
      tags:
        - "Gatherer"
      summary: "Queue Gatherer page for processing"
      operationId: "routes.scrapers.gatherer.route_pages"
      produces:
        - "application/json"
      parameters:
        - name: "page_id"
          in: "path"
          description: "ID of Gatherer page"
          required: true
          type: "integer"
          format: "int64"
      responses:
        200:
          description: "Success"

  /scrapers/magic/cards/{card_id}:
    post:
      tags:
        - "Magic"
      summary: "Queue MTG API card for processing"
      operationId: "routes.scrapers.magic.route_cards"
      produces:
        - "application/json"
      parameters:
        - name: "card_id"
          in: "path"
          description: "ID of MTG API card"
          required: true
          type: "integer"
          format: "int64"
      responses:
        200:
          description: "Success"

  /scrapers/magic/pages/{page_id}:
    post:
      tags:
        - "Magic"
      summary: "Queue MTG API page for processing"
      operationId: "routes.scrapers.magic.route_pages"
      produces:
        - "application/json"
      parameters:
        - name: "page_id"
          in: "path"
          description: "ID of MTG API page"
          required: true
          type: "integer"
          format: "int64"
      responses:
        200:
          description: "Success"

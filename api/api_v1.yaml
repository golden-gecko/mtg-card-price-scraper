swagger: "2.0"

basePath: "/v1"

info:
  title: "API"
  version: "1.0.0"

schemes:
- "http"

tags:
  - name: "Auth"
  - name: "Maintenance"
  - name: "MTG"
  - name: "Scraper"

paths:
  /healthcheck:
    get:
      tags:
        - "Maintenance"
      summary: "Returns service status"
      operationId: "routes.healthcheck.route_healthcheck"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /users:
    post:
      tags:
        - "Auth"
      summary: "Registers new user"
      operationId: "routes.users.route_users"
      produces:
        - "application/json"
      parameters:
        - name: "page"
          in: "body"
          schema:
            type: "object"
            properties:
              email:
                type: "string"
                example: "john@doe.com"
              password_hash:
                type: "string"
                example: "ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb"
      responses:
        200:
          description: "Success"

  /login:
    delete:
      tags:
        - "Auth"
      summary: "Logs out user"
      operationId: "routes.auth.route_logout"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"
    post:
      tags:
        - "Auth"
      summary: "Logs in user"
      operationId: "routes.auth.route_login"
      produces:
        - "application/json"
      parameters:
        - name: "page"
          in: "body"
          schema:
            type: "object"
            properties:
              email:
                type: "string"
                example: "john@doe.com"
              password_hash:
                type: "string"
                example: "ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb"
      responses:
        200:
          description: "Success"

  /blocks:
    get:
      tags:
        - "MTG"
      summary: "Return block list"
      operationId: "routes.blocks.route_blocks"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /cards:
    get:
      tags:
        - "MTG"
      summary: "Return card list"
      operationId: "routes.cards.route_cards"
      produces:
        - "application/json"
      parameters:
        - name: "block"
          in: "query"
          description: "Block name"
          type: "string"
        - name: "color"
          in: "query"
          description: "Card color"
          type: "string"
        - name: "expansion"
          in: "query"
          description: "Expansion name"
          type: "string"
        - name: "format"
          in: "query"
          description: "Format name"
          type: "string"
        - name: "name"
          in: "query"
          description: "Card name"
          type: "string"
        - name: "rarity"
          in: "query"
          description: "Card rarity"
          type: "string"
        - name: "subtype"
          in: "query"
          description: "Card subtype"
          type: "string"
        - name: "type"
          in: "query"
          description: "Card type"
          type: "string"
      responses:
        200:
          description: "Success"

  /colors:
    get:
      tags:
        - "MTG"
      summary: "Return color list"
      operationId: "routes.colors.route_colors"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /expansions:
    get:
      tags:
        - "MTG"
      summary: "Return expansion list"
      operationId: "routes.expansions.route_expansions"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /formats:
    get:
      tags:
        - "MTG"
      summary: "Return format list"
      operationId: "routes.formats.route_formats"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /rarities:
    get:
      tags:
        - "MTG"
      summary: "Return rarity list"
      operationId: "routes.rarities.route_rarities"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /subtypes:
    get:
      tags:
        - "MTG"
      summary: "Return subtype list"
      operationId: "routes.subtypes.route_subtypes"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /types:
    get:
      tags:
        - "MTG"
      summary: "Return type list"
      operationId: "routes.types.route_types"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /scrapers/default/pages:
    post:
      tags:
        - "Scraper"
      summary: "Queue page for indexing"
      operationId: "routes.scrapers.default.route_pages_post"
      produces:
        - "application/json"
      parameters:
        - name: "page"
          in: "body"
          schema:
            type: "object"
            properties:
              configuration:
                type: "string"
                example: "shop"
              stage:
                type: "string"
                example: "main"
              url:
                type: "string"
                example: "https://shop/products"
      responses:
        200:
          description: "Success"
    put:
      tags:
        - "Scraper"
      summary: "Queue page for refreshing"
      operationId: "routes.scrapers.default.route_pages_put"
      produces:
        - "application/json"
      parameters:
        - name: "page"
          in: "body"
          schema:
            type: "object"
            properties:
              configuration:
                type: "string"
                example: "shop"
              stage:
                type: "string"
                example: "main"
              url:
                type: "string"
                example: "https://shop/products"
      responses:
        200:
          description: "Success"

  /scrapers/default/statistics:
    get:
      tags:
        - "Scraper"
      summary: "Return statistics"
      operationId: "routes.scrapers.default.route_statistics"
      produces:
        - "application/json"
      responses:
        200:
          description: "Success"

  /scrapers/gatherer/cards/{card_id}:
    post:
      tags:
        - "Scraper"
      summary: "Queue Gatherer card for processing"
      operationId: "routes.scrapers.gatherer.route_cards"
      produces:
        - "application/json"
      parameters:
        - name: "card_id"
          in: "path"
          description: "ID of Gatherer card"
          required: true
          type: "integer"
          format: "int64"
        - name: "refresh"
          in: "query"
          description: "Refresh Gatherer card"
          type: "boolean"
      responses:
        200:
          description: "Success"

  /scrapers/gatherer/pages/{page_id}:
    post:
      tags:
        - "Scraper"
      summary: "Queue Gatherer page for processing"
      operationId: "routes.scrapers.gatherer.route_pages"
      produces:
        - "application/json"
      parameters:
        - name: "page_id"
          in: "path"
          description: "ID of Gatherer page"
          required: true
          type: "integer"
          format: "int64"
        - name: "refresh"
          in: "query"
          description: "Refresh Gatherer page"
          type: "boolean"
      responses:
        200:
          description: "Success"

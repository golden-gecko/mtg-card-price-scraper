<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>cenykart.pl</title>

        <link href="css/bootstrap.min.css" rel="stylesheet">
        <link href="css/magic.css" rel="stylesheet">
    </head>

    <body>
        <div id="container" class="container">
            <form id="search-form">
                <div class="form-group row">
                    <label for="search-format" class="col-sm-2 col-form-label">Format</label>
                    <div class="col-sm-10">
                        <select id="search-format" class="form-control" name="format"></select>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="search-set" class="col-sm-2 col-form-label">Set</label>
                    <div class="col-sm-10">
                        <select id="search-set" class="form-control" name="set"></select>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="search-type" class="col-sm-2 col-form-label">Type</label>
                    <div class="col-sm-10">
                        <select id="search-type" class="form-control"  name="name"></select>
                    </div>
                </div>

                <div class="form-group row">
                    <div class="col-sm-10">
                        <button id="search-button" type="submit" class="btn btn-primary">Search</button>
                    </div>
                </div>
            </form>

            <div id="search-results"></div>
        </div>

        <script src="js/jquery-3.4.1.min.js"></script>
        <script src="js/bootstrap.min.js"></script>
        <script>
            class SearchForm {
                constructor() {
                    console.log('SearchForm.constructor()');

                    this.search_form = $('#search-form');
                    this.search_format = this.search_form.find('#search-format');
                    this.search_set = this.search_form.find('#search-set');
                    this.search_type = this.search_form.find('#search-type');
                    this.search_results = $('#search-results');

                    this.init_select('formats', this.search_format);
                    this.init_select('sets', this.search_set);
                    this.init_select('types', this.search_type);
                }

                init_select(type, element) {
                    console.log('SearchForm.init_select()');

                    $.getJSON('http://192.168.0.162:8000/v1/' + type, function(json) {
                        $.each(json, function(k, v) {
                            var option = $('<option>');

                            option.val(v);
                            option.text(v);
                            option.appendTo(element);
                        });
                    });
                }
            }

            function setup() {
                $.ajaxSetup({
                    cache: false
                });
            }

            function search() {
                $.getJSON('http://apollo.local:7000/magic/cards?' + search_form.serialize(), function(json) {
                    search_results.empty();

                    $.each(json, function(k, v) {
                        console.log(k, v);

                        var card = $('<div>');
                        card.html(v.oracle.name);
                        card.appendTo(search_results);
                    });
                });
            }

            var search_form = new SearchForm();
        </script>
    </body>
</html>
